name: Build lunch calendar

on:
  schedule:
    # Refresh the school day cycle and fill any missing current/upcoming menu daily.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lunchfeed-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh Osborn day schedule
        run: npm run fetch:days
      - name: Build menu artifacts
        shell: bash
        run: |
          npm run build -- --month current --allow-unpublished --if-missing
          npm run build -- --month next --allow-unpublished --if-missing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: google/gemma-4-26b-a4b-it:free,dots-studio/dots-3-note-preview:free,qwen/qwen3.8-27b:free
          SCHOOL_NAME: Osborn
      - name: Commit newly generated artifacts
        run: |
          if git diff --quiet -- docs; then
            echo "No menu changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update lunch menu artifacts"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
